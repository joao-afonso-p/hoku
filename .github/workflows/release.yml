# macOS release of Hoku, published as a DMG on GitHub Releases.
#
# Triggers:
#   - A pushed tag matching v* (for example v0.1.0) builds Hoku for Apple Silicon,
#     ad-hoc signs it, packages Hoku_<version>_aarch64.dmg, and attaches the DMG plus
#     SHA256SUMS.txt to a DRAFT GitHub Release for that tag, with a build provenance
#     attestation. A maintainer reviews the draft and publishes it by hand.
#   - workflow_dispatch runs the same build. From a branch it's a rehearsal: the DMG and
#     checksums are kept as a workflow artifact and no release is created. From a tag it
#     behaves like a tag push (useful to retry a failed release). The Version workflow
#     (version.yml) starts it this way for the tag it creates when a release PR is merged.
#
# Signing: Hoku is not in the paid Apple Developer Program, so the app is ad-hoc signed
# (no Apple account, no secrets) and not notarized. macOS asks once before the first
# launch of a downloaded copy; docs/releasing.md explains what users see and how
# scripts/install.sh avoids it. This workflow uses no secrets at all.
#
# Nothing here runs Hoku, runs the #[ignore]d probes, or reads provider data (~/.claude,
# ~/.codex, Claude Desktop) or Hoku's index: the runner is a fresh machine with none of it.
#
# Third-party actions are pinned to commit SHAs (Dependabot keeps them current), and no
# build caches are used, so nothing from another workflow run can reach a release build.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Apple Silicon only; see "Decisions" in docs/releasing.md.
  TARGET: aarch64-apple-darwin

jobs:
  verify:
    name: Verify version and run checks
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, to check that a release tag is on main
          persist-credentials: false

      # pnpm version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check version and tag
        id: version
        run: |
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pkg="$(node -p "require('./package.json').version")"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"
          echo "tauri.conf.json $conf, package.json $pkg, Cargo.toml $crate"
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$crate" ]; then
            echo "::error::Versions differ: src-tauri/tauri.conf.json $conf, package.json $pkg, src-tauri/Cargo.toml $crate. Bump all three together."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$conf" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $conf (expected v$conf)."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME points to a commit that isn't on main. Releases are cut from main only."
              exit 1
            fi
          fi
          echo "version=$conf" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # rustup is preinstalled on GitHub's macOS runners.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --target "$TARGET"
          rustup default stable

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      # Tests marked #[ignore] (probes that read the real machine's data) stay ignored.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  build:
    name: Build the app and DMG (macOS)
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      - run: pnpm install --frozen-lockfile

      # APPLE_SIGNING_IDENTITY "-" makes Tauri ad-hoc sign every binary and seal the whole
      # bundle, with hardened runtime and src-tauri/Entitlements.plist. Without that seal a
      # downloaded Hoku.app is reported as "damaged" on Apple Silicon. No Apple account or
      # certificate is involved; with no notarization credentials Tauri skips notarization.
      # Local builds (pnpm tauri build, pnpm install:local) are unaffected.
      - name: Build Hoku.app and the DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --target "$TARGET" --bundles app,dmg --ci

      - name: Locate the build output
        run: |
          bundle="src-tauri/target/$TARGET/release/bundle"
          app="$bundle/macos/Hoku.app"
          dmg="$bundle/dmg/Hoku_${VERSION}_aarch64.dmg"
          [ -d "$app" ] || { echo "::error::$app was not built."; exit 1; }
          [ -f "$dmg" ] || { echo "::error::$dmg was not built."; ls -la "$bundle/dmg" || true; exit 1; }
          echo "HOKU_APP=$app" >> "$GITHUB_ENV"
          echo "HOKU_DMG=$dmg" >> "$GITHUB_ENV"

      # codesign --verify --deep --strict, bundle id com.hoku.app, hardened runtime,
      # entitlements, and no data files inside the bundle; for the app and for the copy
      # inside the DMG (plus the DMG's own checksum).
      - name: Verify the app and the DMG
        run: |
          ./scripts/verify-macos-release.sh "$HOKU_APP" --version "$VERSION"
          ./scripts/verify-macos-release.sh "$HOKU_DMG" --version "$VERSION"

      - name: Stage the DMG and checksums
        run: |
          out="$RUNNER_TEMP/hoku-release"
          mkdir "$out"
          cp "$HOKU_DMG" "$out/"
          (cd "$out" && shasum -a 256 -- *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "HOKU_RELEASE_DIR=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hoku-macos-${{ env.VERSION }}
          path: ${{ env.HOKU_RELEASE_DIR }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub Release
    needs: [verify, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # build provenance attestation (Sigstore)
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hoku-macos-${{ needs.verify.outputs.version }}
          path: release

      - name: Check the checksums
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS.txt

      # Lets anyone check that a DMG was built by this workflow from this repository:
      #   gh attestation verify Hoku_<version>_aarch64.dmg --repo <owner>/hoku
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.dmg

      # Always a draft: publishing is a manual step after the clean-machine test. Assets of
      # an already published release are never replaced.
      - name: Create or update the draft release
        working-directory: release
        run: |
          if is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null)"; then
            if [ "$is_draft" != true ]; then
              echo "::error::Release $TAG is already published. Its assets won't be replaced; release a new version instead."
              exit 1
            fi
            gh release upload "$TAG" ./*.dmg SHA256SUMS.txt --clobber
            echo "Updated the assets of draft release $TAG."
            exit 0
          fi
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # Prepended to GitHub's generated notes.
          notes="Hoku $VERSION for Apple Silicon Macs.

          **Install or update from Terminal** (checks the download, keeps your data):
          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/$GH_REPO/main/scripts/install.sh | bash
          \`\`\`

          **Or install the DMG by hand:** open it and drag Hoku to Applications. Hoku is free and not notarized by Apple, so the first time you open it macOS says it can't verify the developer: click **Done**, then go to System Settings → Privacy & Security and click **Open Anyway**. You only do this once per version.

          Updating keeps your index in \`~/Library/Application Support/com.hoku.app\`, which lives outside the app. Verify a download with \`shasum -a 256 -c SHA256SUMS.txt\` or \`gh attestation verify <dmg> --repo $GH_REPO\`."
          gh release create "$TAG" ./*.dmg SHA256SUMS.txt \
            --draft --verify-tag $prerelease \
            --title "Hoku $VERSION" \
            --notes "$notes" \
            --generate-notes
          echo "Created draft release $TAG. Review and publish it on GitHub."
