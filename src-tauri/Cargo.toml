[package]
name = "ai-session-hub"
version = "0.2.1"
description = "Hoku: a local-first app that indexes Claude Code, Codex, and Claude Desktop sessions read-only"
authors = ["João Afonso"]
license = "MIT"
repository = "https://github.com/joao-afonso-p/hoku"
homepage = "https://github.com/joao-afonso-p/hoku"
readme = "../README.md"
edition = "2021"
publish = false

[lib]
name = "ai_session_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The executable is "Hoku", so macOS shows that name in the Dock even for unbundled dev
# builds (`tauri dev`), not just in Hoku.app. Internal crate names are unchanged.
[[bin]]
name = "Hoku"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
libc = "0.2"

# `macos-private-api` stays on this target table only. tauri-build's allowlist
# check reads `[dependencies] tauri` and ignores target-specific features, then
# requires the feature whenever the merged config has `macOSPrivateApi: true`.
# That flag stays false in tauri.conf.json (Linux forces it false too) so
# `cargo test` passes on both platforms and Linux does not enable the feature.
# Cargo unions this dependency into macOS builds, which is what turns the
# private API on. Do not add `tauri.macos.conf.json` with `macOSPrivateApi: true`.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSBitmapImageRep", "NSDockTile", "NSGraphics", "NSImage", "NSImageRep", "NSPasteboard", "NSResponder", "NSRunningApplication"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
